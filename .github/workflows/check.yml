name: Check lessons

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbclient nbformat
          python -m ipykernel install --user --name python3
      - name: Static checks
        run: python scripts/check_lessons.py
      - name: Same behaviour as the Chinese original
        run: |
          git clone --depth 1 https://github.com/djzoom/AURORA ../AURORA
          python scripts/compare_with_original.py --aurora ../AURORA
