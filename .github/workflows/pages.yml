name: Deploy Aurora Quest

on:
  push:
    branches: [main]
    paths:
      - "quest/**"
      - "docs/VIDEO_LIBRARY.md"
      - "README.md"
      - "scripts/generate_quest_data.mjs"
      - "scripts/generate_video_library_data.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate course snapshot (from README)
        run: node scripts/generate_quest_data.mjs
      - name: Generate video library (from docs/VIDEO_LIBRARY.md)
        run: node scripts/generate_video_library_data.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: quest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
